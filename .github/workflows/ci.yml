name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned by commit SHA; the comment says which release it is.
# GOTOOLCHAIN=local makes each matrix job run the Go it installed. Without it,
# a job labelled with an older Go would silently download the version go.mod
# names and test that instead.
env:
  GOTOOLCHAIN: local

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Oldest supported (go.mod's go directive) and current stable.
        go: ['1.22', 'stable']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go }}
      - run: go version
      - name: gofmt
        if: matrix.go == 'stable'
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "not gofmt-formatted:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      # Includes TestREADMEScenarioTableIsCurrent: the README table is
      # generated by --scenario-table and compared byte for byte.
      - run: go test -race -cover ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: shellcheck
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          shellcheck deploy/epilog.sh scripts/integration.sh

  integration:
    # The shipped wrapper and the real binary under `env -i` (no PATH, as
    # slurmd runs an Epilog), with fake nvidia-smi / scontrol and a fake
    # /proc/driver/nvidia/gpus. Asserts the exit contract end to end.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
      - run: bash scripts/integration.sh
      - name: The simulator never exits non-zero, even with --enforce
        run: |
          go build -o /tmp/egv ./cmd/epilog-gpu-validator
          for s in healthy ecc off-bus remap-failure; do
            SLURM_JOB_ID=1 /tmp/egv --simulate "$s" --enforce --json >/dev/null
            code=$?
            if [ "$code" -ne 0 ]; then echo "--simulate $s exited $code"; exit 1; fi
          done
